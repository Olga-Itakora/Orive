# Entorno completo: PostgreSQL + migraciones/seed + aplicación.
# Uso: cp .env.example .env (y edita los secretos) && docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: oriva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oriva}
      POSTGRES_DB: oriva
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oriva"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrator }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://oriva:${POSTGRES_PASSWORD:-oriva}@db:5432/oriva?schema=public
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://oriva:${POSTGRES_PASSWORD:-oriva}@db:5432/oriva?schema=public
      EVIDENCE_STORAGE_DIR: /app/storage/evidence
    ports:
      - "3000:3000"
    volumes:
      - evidence:/app/storage/evidence
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  evidence:
