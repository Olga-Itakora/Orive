function normalize(s) {
  s = String(s).toUpperCase().trim();
  s = s.replace(/^((C[OÓ]DIGO|CODE)\s+)?ORIDE(\s+CODE)?[\s:]*/, "");
  s = s.replace(/[\s·_—–.,;:\/+]+/g, "-");
  return s.replace(/-+/g, "-").replace(/^-|-$/g, "");
}

  var code = normalize(raw);
  var tok = code === "" ? [] : code.split("-");
  if (tok.length < 2) return { valid: false, error: "Un código ORIDE empieza por el tipo de obra y el uso de IA, por ejemplo LI-IA0-EV0 o LI-IGB-EV1-GEN24." };

  var ia;

  else if (tok.length && /^([A-Z]{3}\d*|E?V[01]?)$/.test(tok[0])) ia = "IA1";
  else ia = tok.shift();
  var declaredCat = null;
  var m = /^IG([A-Z])$/.exec(ia || "");

  var ev = "";

    if (level < 2 && scope !== 0) return { valid: false, error: "En " + t + ", con los grados 0 y 1 la segunda cifra es 0." };
    if (scope > 4) return { valid: false, error: "En " + t + ", el alcance va de 0 a 4." };
    seen.push(am[1]);
    acts[am[1]] = [level, level >= 2 ? scope : null];
  }

function finish(r) {

  var term = r.ia === 0 ? "IA0" : (r.keepIa1 ? "IA1" : (r.cat ? "IG" + r.cat : "IA1"));
  r.lines = [r.type + "-" + term + (r.ev === null ? "" : "-EV" + r.ev)];
  if (r.acts.length) r.lines.push(r.acts.map(function (a) { return a[0] + a[1] + (a[1] >= 2 ? a[2] : 0); }).join("-"));
  r.code = r.lines.join("-");
  return { valid: true, r: r };
}

/** Índice Global: IG = G + (100 − G) · P, con intervalos (ig_from_result del motor PHP, sin la pregunta de proporción). */
function computeIndex(r) {
  var out = { status: "not_calculable", reason: null, G: null, P: null, IG: null, q: null, rows: [] };
  if (r.ia === 0) { out.status = "ok"; out.G = [0, 0]; out.P = [0, 0]; out.IG = [0, 0]; return out; }
  if (!r.acts.length) { out.reason = "no_acts"; return out; }
  if (r.allZero) { out.reason = "all_zero"; return out; }
  var W = D.weights[r.type];
  var gen = [], auxLo = 0, auxHi = 0;
  r.acts.forEach(function (a) {
    var w = W[a[0]], f = D.factors[a[1]], S = a[2] === null ? [0, 0] : D.scope[a[2]];
    var row = { act: a[0], role: w[0], level: a[1], scope: a[2], factor: f, S: S, weight: w[1], contrib: null };
    if (w[0] === "gen") gen.push({ f: f, S: S });
    else { row.contrib = [w[1] * f * S[0], w[1] * f * S[1]]; auxLo += row.contrib[0]; auxHi += row.contrib[1]; }
    out.rows.push(row);
  });
  var G = [0, 0];
  var used = gen.filter(function (g) { return g.f > 0; });
  if (used.length) {
    var fs = used.map(function (g) { return g.f; });
    var q = [Math.min.apply(null, used.map(function (g) { return g.S[0]; })), Math.max.apply(null, used.map(function (g) { return g.S[1]; }))];
    out.q = q;
    G = [100 * q[0] * Math.min.apply(null, fs), 100 * q[1] * Math.max.apply(null, fs)];
  }
  var P = [Math.min(1, auxLo), Math.min(1, auxHi)];
  var comb = function (g, p) { return Math.min(100, g + (100 - g) * p); };
  out.status = "ok"; out.G = G; out.P = P; out.IG = [comb(G[0], P[0]), comb(G[1], P[1])];
  return out;
}

/** Categoría por el punto medio, sin redondear: A si m ≤ 10; B si m ≤ 25; … ; F si m > 90. */
function classify(lo, hi) {
  var m = (lo + hi) / 2;
  var cats = Object.keys(D.cats);
  for (var i = 0; i < cats.length; i++) if (m <= D.cats[cats[i]][1]) return cats[i];
  return "F";
}
// ===== ENGINE END =====

// ===== Presentación: cinco escalas =====
var NB = " ";
var C = { ink: "#1c2526", muted: "#5b6b6c", dark: "#0e3b3c", darkest: "#0a2b2c", mid: "#2ba39a", light: "#a9d2cd", pale: "#eef6f5", line: "#c9d3d1", ok: "#1f6b45" };
var FONT = "system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif";
var WORD = { A: "muy bajo", B: "bajo", C: "moderado", D: "alto", E: "muy alto", F: "extremo" };
var CATS = Object.keys(D.cats);

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function wrap(text, max) {
  var lines = [], line = "";
  text.split(" ").forEach(function (w) { if (line && (line + " " + w).length > max) { lines.push(line); line = w; } else line = (line + " " + w).trim(); });
  if (line) lines.push(line);
  return lines;
}
function t(x, y, txt, o) {
  o = o || {};
  return '<text x="' + x + '" y="' + y + '" font-size="' + (o.size || 14) + '"' + (o.weight ? ' font-weight="' + o.weight + '"' : "") + (o.anchor ? ' text-anchor="' + o.anchor + '"' : "") + (o.ls ? ' letter-spacing="' + o.ls + '"' : "") + ' fill="' + (o.fill || C.ink) + '">' + esc(txt) + "</text>";
}
function lines(x, y, arr, o, step) { return arr.map(function (l, i) { return t(x, y + i * (step || 19), l, o); }).join(""); }
function tick(cx, cy, title) {
  return '<g><title>' + esc(title) + '</title><circle cx="' + cx + '" cy="' + cy + '" r="10" fill="' + C.ok + '"/><path d="M ' + (cx - 5) + " " + cy + ' l 3.5 3.5 l 6.5 -7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>';
}
function svgOpen(w, h, v) { return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + " " + h + '" role="img" aria-label="' + esc(v.aria) + '" font-family="' + FONT + '">'; }
function header(v, x) { return t(x, 26, "DECLARACIÓN ORIDE", { size: 11, weight: 600, ls: 2, fill: C.head || "#154849" }) + t(x, 54, v.typeName, { size: 22, weight: 700, fill: C.darkest }); }
/** Título en varias líneas si no cabe (max caracteres por línea), con el tick tras la última. Devuelve [svg, líneas]. */
function titleBlock(x, y, v, size, max) {
  var ls = wrap(v.title, max), lh = size + 4, s = "";
  ls.forEach(function (l, i) { s += t(x, y + i * lh, l, { size: size, weight: 700, fill: C.darkest }); });
  if (v.ev) {
    var last = ls[ls.length - 1], tx = x + last.length * size * 0.56 + 16, ty = y + (ls.length - 1) * lh;
    if (last.length + 3 > max) { tx = x + 10; ty += lh; ls.push(""); }
    s += tick(tx, ty - 6, "Se puede mostrar el proceso de creación");
  }
  return [s, ls.length];
}
function titleWithTick(x, y, v, size) {
  var s = t(x, y, v.title, { size: size || 17, weight: 700, fill: C.darkest });
  if (v.ev) s += tick(x + v.title.length * (size || 17) * 0.56 + 18, y - 6, "Se puede mostrar el proceso de creación");
  return s;
}

/** Lo que se muestra, igual para las cinco: título, texto, intervalo, punto medio, tramo y evidencias. */
function makeView(r) {
  var v = { typeName: D.types[r.type].name, ia: r.ia, ev: r.ev === 1, cat: null, lo: null, hi: null, mid: null, amount: "", title: "", body: "" };
  if (r.ia === 0) {
    v.title = "Obra 100" + NB + "% libre de IA"; v.body = "La persona autora declara que no utilizó IA."; v.amount = "0" + NB + "%";
    v.lo = v.hi = v.mid = 0;
  } else if (r.ig.status !== "ok") {
    v.title = "Se utilizó IA"; v.body = "No se detalla en qué actividades, así que no se puede estimar cuánto aportó."; v.amount = "—";
  } else {
    v.cat = r.cat; v.lo = r.ig.IG[0]; v.hi = r.ig.IG[1]; v.mid = (v.lo + v.hi) / 2;
    var lo = Math.round(v.lo), hi = Math.round(v.hi);
    // Cifra principal: el punto medio, redondeado (el rango va en la explicación).
    var m = Math.round(v.mid);
    v.amount = hi === 0 ? "<1" + NB + "%" : m + NB + "%";
    v.title = "Uso de IA " + WORD[r.cat];
    v.body = "Se estima que la IA aportó " + (hi === 0 ? "menos del 1" + NB + "%" : lo === hi ? "alrededor del " + lo + NB + "%" : "entre el " + lo + NB + "% y el " + hi + NB + "%") + " de esta obra, según lo declarado.";
  }
  v.aria = "Declaración ORIDE, " + v.typeName + ". " + v.title + ". " + v.body + (v.ev ? " Evidencia documentada." : "");
  return v;
}

// Medidor semicircular con una paleta de colores
// P: { mode: "alt" (dos colores alternos y el tramo de la obra en «cur») | "seq" (seis colores de menos a más),
//      bands, cur, accent (margen de la estimación), ink (aguja y textos), head (rótulo) }
function gauge(v, P) {
  var save = {}; ["darkest", "mid", "head"].forEach(function (k) { save[k] = C[k]; });
  C.darkest = P.ink; C.mid = P.accent; C.head = P.head;
  var W = 400, H = 380, cx = 200, cy = 214, r = 124, sw = 28;
  var pt = function (p, rr) { var a = Math.PI * (1 - p / 100); return [cx + rr * Math.cos(a), cy - rr * Math.sin(a)]; };
  var arc = function (p0, p1, rr) { var a = pt(p0, rr), b = pt(p1, rr); return "M " + a[0].toFixed(2) + " " + a[1].toFixed(2) + " A " + rr + " " + rr + " 0 0 1 " + b[0].toFixed(2) + " " + b[1].toFixed(2); };
  var s = svgOpen(W, H, v) + header(v, 16);
  CATS.forEach(function (k, i) {
    var here = v.cat === k, col, op = 1;
    if (P.mode === "alt") col = here ? P.cur : P.bands[i % 2];
    else col = P.bands[i]; // v8: sin aclarar los demás tramos
    s += '<path d="' + arc(D.cats[k][0], D.cats[k][1], r) + '" fill="none" stroke="' + col + '" stroke-opacity="' + op + '" stroke-width="' + sw + '"/>';
  });
  CATS.forEach(function (k) { var a = pt(D.cats[k][1], r - sw / 2), b = pt(D.cats[k][1], r + sw / 2); s += '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '" stroke="#fff" stroke-width="2"/>'; });
  // En los degradados, el tramo de la obra se marca con un borde (los demás conservan su color)
  if (P.mode === "seq" && v.cat) {
    var k = v.cat, a0 = pt(D.cats[k][0], r + sw / 2), a1 = pt(D.cats[k][1], r + sw / 2), b1 = pt(D.cats[k][1], r - sw / 2), b0 = pt(D.cats[k][0], r - sw / 2), ro = r + sw / 2, ri = r - sw / 2;
    s += '<path d="M ' + a0[0] + ' ' + a0[1] + ' A ' + ro + ' ' + ro + ' 0 0 1 ' + a1[0] + ' ' + a1[1] + ' L ' + b1[0] + ' ' + b1[1] + ' A ' + ri + ' ' + ri + ' 0 0 0 ' + b0[0] + ' ' + b0[1] + ' Z" fill="none" stroke="' + P.ink + '" stroke-width="3.5" stroke-linejoin="round"/>';
  }
  [0, 25, 50, 75, 100].forEach(function (p) { var q = pt(p, r + sw / 2 + 12); s += t(q[0], q[1] + 4, p + (p === 100 ? NB + "%" : ""), { size: 11, anchor: p === 50 ? "middle" : (p < 50 ? "end" : "start"), fill: C.muted }); });
  if (v.mid !== null) {
    var n = pt(v.mid, r - sw / 2 - 6);
    s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + n[0].toFixed(2) + '" y2="' + n[1].toFixed(2) + '" stroke="' + P.ink + '" stroke-width="4" stroke-linecap="round"/>';
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="9" fill="' + P.ink + '"/>';
  }
  s += t(cx, cy + 44, v.amount, { size: 30, weight: 700, anchor: "middle", fill: P.ink });
  s += t(cx, cy + 74, v.title, { size: 17, weight: 700, anchor: "middle", fill: P.ink });
  var body = wrap(v.body, 52);
  s += lines(cx, cy + 98, body, { size: 13, anchor: "middle", fill: C.ink }, 17);
  // Evidencias: un texto debajo de la explicación, en lugar del tick
  if (v.ev) {
    var ey = cy + 98 + body.length * 17 + 6, ew = 168;
    s += '<rect x="' + (cx - ew / 2) + '" y="' + ey + '" width="' + ew + '" height="24" rx="12" fill="#f4f1ec" stroke="' + P.ink + '" stroke-width="1"/>';
    s += t(cx, ey + 16.5, "Evidencia documentada", { size: 12.5, weight: 600, anchor: "middle", fill: P.ink });
  }
  Object.keys(save).forEach(function (k) { C[k] = save[k]; });
  return s + "</svg>";
}

var PALETTES = [
  { name: "Frío a cálido", why: "Del verde azulado al naranja: transmite «más IA» sin llegar al rojo de alarma. La aguja señala el punto medio de la estimación.", mode: "seq", bands: ["#2ba39a", "#7cc4a4", "#c9d98a", "#f2c14e", "#ef9a3c", "#e0692e"], accent: "#e0692e", ink: "#2d2a26", head: "#4a4540" },
];

// Las ocho cajas
(function () {
  var g = document.getElementById("grid");
  PALETTES.forEach(function (P, i) {
    var sec = document.createElement("section");
    sec.className = "option";
    sec.setAttribute("aria-labelledby", "p" + i);
    sec.innerHTML = '<h2 id="p' + i + '">Medidor · ' + esc(P.name) + '</h2><p class="why">' + esc(P.why) + '</p>'
      + '<div class="decl" style="border-color:' + P.ink + '"><div data-pal="' + i + '"></div><p class="code">Código ORIDE <code data-code-out></code></p></div>';
    g.appendChild(sec);
  });
})();

function show(raw) {
  var res = parseCode(raw), err = document.getElementById("code-error"), input = document.getElementById("code-input");
  if (!res.valid) { err.textContent = res.error; err.hidden = false; input.setAttribute("aria-invalid", "true"); return; }
  err.hidden = true; input.removeAttribute("aria-invalid");
  var v = makeView(res.r);
  Array.prototype.forEach.call(document.querySelectorAll("[data-pal]"), function (el) { el.innerHTML = gauge(v, PALETTES[+el.getAttribute("data-pal")]); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-code-out]"), function (el) { el.textContent = res.r.lines.join(" "); });
  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-code") === raw)); });
}
document.getElementById("lab").addEventListener("submit", function (e) { e.preventDefault(); show(document.getElementById("code-input").value); });
Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (b) {
  b.addEventListener("click", function () { document.getElementById("code-input").value = b.getAttribute("data-code"); show(b.getAttribute("data-code")); });
});
show(document.getElementById("code-input").value);
</script>
